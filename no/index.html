<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Service Proxy</title>
</head>
<body>
    <div id="output"></div>
    <script>
        // Fetch from the API on page load
        fetch('https://naas.isalman.dev/no')
            .then(response => response.json())
            .then(data => {
                document.getElementById('output').textContent = data.reason;
                document.body.textContent = data.reason;
            })
            .catch(error => {
                // If direct fetch fails due to CORS, try the proxy
                fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://naas.isalman.dev/no'))
                    .then(response => response.json())
                    .then(proxyData => {
                        const data = JSON.parse(proxyData.contents);
                        document.body.textContent = data.reason;
                    })
                    .catch(err => {
                        document.body.textContent = 'Service temporarily unavailable';
                    });
            });
    </script>
</body>
</html>
